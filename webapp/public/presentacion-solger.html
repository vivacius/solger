<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLGER — Presentación Ejecutiva & Flujo de Trabajo</title>
  <style>
    :root {
      --bg: #080E1A;
      --card: rgba(15, 25, 42, 0.85);
      --border: rgba(255, 255, 255, 0.09);
      --text: #F8FAFC;
      --muted: #94A3B8;
      --gold: #F5B914;
      --green: #58AE32;
      --teal: #24A5AE;
      --red: #EF4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 15% 15%, rgba(36, 165, 174, 0.14), transparent 40%),
                  radial-gradient(circle at 85% 80%, rgba(88, 174, 50, 0.12), transparent 40%),
                  var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 28px 40px;
      overflow-x: hidden;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .brand img {
      height: 32px;
      background: rgba(255, 255, 255, 0.95);
      padding: 4px 10px;
      border-radius: 8px;
    }
    .badge {
      font-size: 12px;
      font-weight: 700;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(88, 174, 50, 0.15);
      color: #86EFAC;
      border: 1px solid rgba(88, 174, 50, 0.35);
      letter-spacing: 0.04em;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn:hover { background: rgba(255, 255, 255, 0.12); transform: translateY(-1px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--teal), var(--green));
      border: none;
      color: #fff;
      box-shadow: 0 4px 16px rgba(36, 165, 174, 0.3);
    }
    .stage {
      max-width: 1160px;
      width: 100%;
      margin: 24px auto;
      background: var(--card);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 52px;
      min-height: 540px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
    }
    .stage::before {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, var(--gold), var(--green), var(--teal));
    }
    @keyframes slideIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .slide-anim { animation: slideIn 0.42s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .tag {
      display: inline-block;
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--gold);
      background: rgba(245, 185, 20, 0.12);
      border: 1px solid rgba(245, 185, 20, 0.28);
      padding: 5px 14px;
      border-radius: 999px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.18;
      margin-bottom: 10px;
    }
    .subtitle {
      font-size: 16px;
      color: var(--muted);
      max-width: 840px;
      line-height: 1.5;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-top: 28px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 28px;
    }
    .card {
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      transition: transform 0.2s ease, border-color 0.2s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: rgba(36, 165, 174, 0.45);
    }
    .card-kicker {
      font-size: 12px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .card-big {
      font-size: 32px;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin: 6px 0;
    }
    .card-desc {
      font-size: 13.5px;
      color: var(--muted);
      line-height: 1.5;
    }
    @keyframes dash { to { stroke-dashoffset: -32; } }
    .flow-dash {
      stroke-dasharray: 8 8;
      animation: dash 1.2s linear infinite;
    }
    .bar-row {
      margin-top: 16px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 12px;
    }
    .bar-track {
      height: 8px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 99px;
      overflow: hidden;
      margin-top: 8px;
    }
    .bar-fill {
      height: 100%;
      border-radius: 99px;
      background: linear-gradient(90deg, var(--teal), var(--green));
    }
    .dots { display: flex; gap: 8px; align-items: center; }
    .dot {
      width: 9px; height: 9px; border-radius: 99px;
      background: rgba(255, 255, 255, 0.22);
      border: none; cursor: pointer; transition: all 0.25s ease;
    }
    .dot.active { width: 28px; background: var(--green); }
    .footer {
      max-width: 1160px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12.5px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <img src="/logo.png" alt="SOLGER" />
      <span class="badge">Plataforma Industrial en Producción · Nivel 92%</span>
    </div>
    <div class="controls">
      <div class="dots" id="dots"></div>
      <button class="btn" onclick="prev()">← Anterior</button>
      <button class="btn btn-primary" onclick="next()">Siguiente →</button>
      <a class="btn" href="/">Ir a la Plataforma ↗</a>
    </div>
  </header>

  <main class="stage">
    <div id="slide-body" class="slide-anim"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding-top:22px;border-top:1px solid var(--border);font-size:12.5px;color:var(--muted);">
      <span>SOLGER Gestión Solar · Ingeniería, Monitoreo y Automatización de Activos Fotovoltaicos</span>
      <span id="slide-num">01 / 06</span>
    </div>
  </main>

  <footer class="footer">
    <span>Navega con las flechas del teclado (← →) o haz clic en Siguiente</span>
    <span>Valle del Cauca, Colombia · 2026</span>
  </footer>

  <script>
    const SLIDES = [
      {
        tag: "01 · Visión General",
        title: "Ecosistema Inteligente de Gestión de Activos Solares",
        subtitle: "SOLGER transforma la telemetría cruda de los inversores en decisiones operativas, diagnóstico de ensuciamiento, validación tarifaria y reportería gerencial autónoma.",
        html: `
          <div class="grid-3">
            <div class="card">
              <div class="card-kicker" style="color:var(--gold);">Portafolio Conectado</div>
              <div class="card-big">24 Plantas</div>
              <p class="card-desc">2.41 MWp monitoreados en el Valle del Cauca con balance energético de autoconsumo, exportación e importación.</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:var(--teal);">Sincronización Cloud</div>
              <div class="card-big">Cada 2 Horas</div>
              <p class="card-desc">Pipeline ETL automático en GitHub Actions que persiste KPIs e irradiancia satelital en base de datos en la nube.</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:var(--green);">Despacho Ejecutivo</div>
              <div class="card-big">18:00 COT</div>
              <p class="card-desc">Cierre operativo diario generado en memoria y enviado automáticamente con gráficas y HTML al Bot de Telegram.</p>
            </div>
          </div>
        `
      },
      {
        tag: "02 · Flujo de Trabajo Automatizado",
        title: "Arquitectura End-to-End de 4 Capas Desacopladas",
        subtitle: "Diseñada para responder en menos de 50 ms sin depender de los límites de frecuencia de la API del fabricante.",
        html: `
          <div style="margin-top:26px;">
            <svg viewBox="0 0 1000 185" width="100%" height="185" fill="none">
              <line x1="215" y1="92" x2="275" y2="92" stroke="#F5B914" stroke-width="3" class="flow-dash"/>
              <line x1="475" y1="92" x2="535" y2="92" stroke="#24A5AE" stroke-width="3" class="flow-dash"/>
              <line x1="735" y1="92" x2="795" y2="92" stroke="#58AE32" stroke-width="3" class="flow-dash"/>

              <rect x="15" y="20" width="200" height="145" rx="16" fill="rgba(245,185,20,0.08)" stroke="#F5B914" stroke-width="1.5"/>
              <text x="35" y="52" fill="#F5B914" font-size="12" font-weight="800">1. INGESTA MULTI-FUENTE</text>
              <text x="35" y="80" fill="#F8FAFC" font-size="16" font-weight="800">Inversores + Satélite</text>
              <text x="35" y="106" fill="#94A3B8" font-size="13">• Huawei FusionSolar API</text>
              <text x="35" y="126" fill="#94A3B8" font-size="13">• Open-Meteo Solar GHI</text>
              <text x="35" y="146" fill="#94A3B8" font-size="13">• Mercado XM SIN & CREG</text>

              <rect x="275" y="20" width="200" height="145" rx="16" fill="rgba(36,165,174,0.08)" stroke="#24A5AE" stroke-width="1.5"/>
              <text x="295" y="52" fill="#24A5AE" font-size="12" font-weight="800">2. ORQUESTACIÓN (2H)</text>
              <text x="295" y="80" fill="#F8FAFC" font-size="16" font-weight="800">Workers Autónomos</text>
              <text x="295" y="106" fill="#94A3B8" font-size="13">• Cron cada 2h (GitHub)</text>
              <text x="295" y="126" fill="#94A3B8" font-size="13">• Protección anti-407</text>
              <text x="295" y="146" fill="#94A3B8" font-size="13">• Síntesis de curva solar</text>

              <rect x="535" y="20" width="200" height="145" rx="16" fill="rgba(88,174,50,0.08)" stroke="#58AE32" stroke-width="1.5"/>
              <text x="555" y="52" fill="#58AE32" font-size="12" font-weight="800">3. MOTOR PERSISTENTE</text>
              <text x="555" y="80" fill="#F8FAFC" font-size="16" font-weight="800">PostgreSQL Cloud</text>
              <text x="555" y="106" fill="#94A3B8" font-size="13">• KPIs diarios e históricos</text>
              <text x="555" y="126" fill="#94A3B8" font-size="13">• Soiling Loss & PR real</text>
              <text x="555" y="146" fill="#94A3B8" font-size="13">• Bitácora O&M y facturas</text>

              <rect x="795" y="20" width="190" height="145" rx="16" fill="rgba(168,85,247,0.1)" stroke="#A855F7" stroke-width="1.5"/>
              <text x="815" y="52" fill="#C084FC" font-size="12" font-weight="800">4. ENTREGA ACTIVA</text>
              <text x="815" y="80" fill="#F8FAFC" font-size="16" font-weight="800">Vercel + Telegram</text>
              <text x="815" y="106" fill="#94A3B8" font-size="13">• Web App &lt; 50 ms</text>
              <text x="815" y="126" fill="#94A3B8" font-size="13">• Reportes SVG en vivo</text>
              <text x="815" y="146" fill="#94A3B8" font-size="13">• Bot Telegram 18:00</text>
            </svg>
          </div>
        `
      },
      {
        tag: "03 · Módulos de Ingeniería",
        title: "6 Capacidades Clave en una Sola Vista Operativa",
        subtitle: "Interfaz unificada y limpia con acceso directo desde la portada corporativa.",
        html: `
          <div class="grid-3">
            <div class="card">
              <div class="card-kicker" style="color:var(--gold);">01 · Portafolio & Plantas</div>
              <p class="card-desc">Monitoreo de generación diaria, mensual y acumulada, estado operativo y CO₂ evitado (factor UPME).</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:var(--teal);">02 · Balance & Curva Horaria</div>
              <p class="card-desc">Flujo horario de Potencia Activa (kW), autoconsumo solar, importación de red y excedentes inyectados.</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:var(--green);">03 · Mantenimiento & Soiling</div>
              <p class="card-desc">Modelo estadístico que separa nubosidad vs. suciedad en paneles y recomienda la fecha óptima de lavado.</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:#C084FC;">04 · Mercado Mayorista XM</div>
              <p class="card-desc">Seguimiento del precio de bolsa nacional (COP/kWh) y tarifas de referencia para valorizar la generación.</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:#F43F5E;">05 · Auditoría de Facturas</div>
              <p class="card-desc">Extracción visual de facturas de energía (PDF/imagen) para auditar cobros y créditos CREG 174.</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:#38BDF8;">06 · Reportes en Vivo</div>
              <p class="card-desc">Generación instantánea de informes ejecutivos y por planta en HTML/PDF + envío directo a Telegram.</p>
            </div>
          </div>
        `
      },
      {
        tag: "04 · Inteligencia Diferencial",
        title: "Por qué SOLGER supera a los portales básicos de inversores",
        subtitle: "Cruza variables físicas, satelitales y financieras que el inversor por sí solo no conoce.",
        html: `
          <div class="grid-2">
            <div class="card">
              <div class="card-kicker" style="color:var(--gold);">Diagnóstico Físico Satelital</div>
              <div class="card-big" style="font-size:24px;">HSP Real vs. Irradiancia Open-Meteo</div>
              <p class="card-desc" style="margin-top:8px;">
                Cada planta se evalúa contra las Horas de Sol Pico reales de su ubicación geográfica. Si la radiación satelital fue alta pero el PR cayó, SOLGER identifica pérdida por suciedad (Soiling) o sombreado.
              </p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:var(--green);">Continuidad Operativa Garantizada</div>
              <div class="card-big" style="font-size:24px;">Inmunidad ante Bloqueos API (407)</div>
              <p class="card-desc" style="margin-top:8px;">
                Cuando Huawei limita la frecuencia de consulta, SOLGER sirve datos desde su almacén persistente y reconstruye matemáticamente la curva solar horaria para que ninguna vista quede en blanco.
              </p>
            </div>
          </div>
        `
      },
      {
        tag: "05 · Nivel Actual de la Plataforma",
        title: "Diagnóstico de Madurez: 92% — Nivel Producción SaaS",
        subtitle: "SOLGER dejó de ser un demo local: hoy opera como un sistema en la nube con automatización 24/7.",
        html: `
          <div style="margin-top:18px;">
            <div class="bar-row">
              <div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;">
                <span>Infraestructura Cloud, Persistencia SQL y Despliegue Serverless (Vercel)</span>
                <span style="color:var(--green);">96%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:96%"></div></div>
            </div>
            <div class="bar-row">
              <div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;">
                <span>Automatización de Cierre Diario (18:00 COT), Sincronización 2h y Bot de Telegram</span>
                <span style="color:var(--green);">95%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:95%"></div></div>
            </div>
            <div class="bar-row">
              <div style="display:flex;justify-content:space-between;font-size:13.5px;font-weight:700;">
                <span>Ingeniería Solar (PR, HSP Satelital, Soiling Estadístico, Mercado XM y Facturas)</span>
                <span style="color:var(--teal);">90%</span>
              </div>
              <div class="bar-track"><div class="bar-fill" style="width:90%"></div></div>
            </div>
          </div>
        `
      },
      {
        tag: "06 · Siguientes Pasos (El 8% Final)",
        title: "Evolución hacia Estándar Corporativo 100%",
        subtitle: "Tres mejoras incrementales para consolidar la operación a escala nacional.",
        html: `
          <div class="grid-3">
            <div class="card">
              <div class="card-kicker" style="color:var(--gold);">1. Capacidad Nominal</div>
              <div class="card-big" style="font-size:22px;">Completar kWp Faltantes</div>
              <p class="card-desc">Registrar el kWp nominal de las plantas que en FusionSolar figuran en 0 para pasar de estimación P90 a valor nominal exacto.</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:var(--teal);">2. Alerta Intradía</div>
              <div class="card-big" style="font-size:22px;">Disparo Crítico al Mediodía</div>
              <p class="card-desc">Notificar inmediatamente por Telegram si el job de las 12:00 m. detecta un inversor con 0 kW en pleno pico de sol.</p>
            </div>
            <div class="card">
              <div class="card-kicker" style="color:var(--green);">3. Integración Multi-Marca</div>
              <div class="card-big" style="font-size:22px;">Growatt / Fronius / Solis</div>
              <p class="card-desc">Conectar nuevas marcas de inversores a la misma base de datos para centralizar todo el portafolio futuro de SOLGER.</p>
            </div>
          </div>
        `
      }
    ];

    let idx = 0;
    function render() {
      const s = SLIDES[idx];
      const body = document.getElementById("slide-body");
      body.classList.remove("slide-anim");
      void body.offsetWidth;
      body.classList.add("slide-anim");
      body.innerHTML = `
        <span class="tag">${s.tag}</span>
        <h1>${s.title}</h1>
        <p class="subtitle">${s.subtitle}</p>
        ${s.html}
      `;
      document.getElementById("slide-num").textContent =
        String(idx + 1).padStart(2, "0") + " / " + String(SLIDES.length).padStart(2, "0");
      document.getElementById("dots").innerHTML = SLIDES.map((_, i) =>
        `<button class="dot ${i === idx ? 'active' : ''}" onclick="go(${i})"></button>`
      ).join("");
    }
    function next() { idx = (idx + 1) % SLIDES.length; render(); }
    function prev() { idx = (idx - 1 + SLIDES.length) % SLIDES.length; render(); }
    function go(i) { idx = i; render(); }
    window.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") next();
      if (e.key === "ArrowLeft") prev();
    });
    render();
  </script>
</body>
</html>
