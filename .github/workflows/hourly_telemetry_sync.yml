name: Sincronización de Base de Datos cada 15 Minutos (Ventana Solar)

on:
  schedule:
    # Cada 15 minutos en ventana solar (11:00–23:59 UTC = 06:00–18:59 Hora Colombia, UTC-5)
    - cron: '*/15 11-23 * * *'
    # Revisión nocturna única a las 23:00 COT (04:00 UTC)
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  etl-solar-sync:
    name: Sincronizar Telemetría, Satélite y Alertas Críticas
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout del repositorio SOLGER
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          pip install -r requirements.txt

      - name: Ejecutar ETL y Verificación de Ventana Solar
        env:
          FUSIONSOLAR_BASE_URL: ${{ secrets.FUSIONSOLAR_BASE_URL }}
          FUSIONSOLAR_USERNAME: ${{ secrets.FUSIONSOLAR_USERNAME }}
          FUSIONSOLAR_PASSWORD: ${{ secrets.FUSIONSOLAR_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python backend/etl_sync.py
