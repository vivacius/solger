name: CI — Pytest & Frontend Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Pytest Backend & Analytics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de backend y pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Verificar sintaxis Python
        run: |
          python -m py_compile backend/main.py analytics/report_generator.py backend/kpi.py backend/anomalies.py

      - name: Ejecutar suite pytest
        run: |
          pytest -v tests/

  frontend-build:
    name: TypeScript & Vite Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: webapp/package-lock.json

      - name: Instalar dependencias y compilar frontend
        run: |
          npm --prefix webapp ci
          npm --prefix webapp run build
