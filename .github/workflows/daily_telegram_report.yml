name: Reporte Ejecutivo Diario SOLGER (Telegram)

on:
  schedule:
    # 23:00 UTC = 18:00 Hora Colombia (America/Bogota, UTC-5) — Cierre del día solar
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Motivo de la ejecución manual (opcional)'
        required: false
        default: 'Cierre manual de portafolio'

jobs:
  send-telegram-report:
    name: Generar Reportes y Enviar a Telegram
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout del repositorio SOLGER
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependencias de Backend y Analytics
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install matplotlib numpy python-dotenv requests

      - name: Generar Reporte Ejecutivo + Plantas y Enviar por Telegram
        env:
          FUSIONSOLAR_BASE_URL: ${{ secrets.FUSIONSOLAR_BASE_URL || 'https://la5.fusionsolar.huawei.com' }}
          FUSIONSOLAR_USERNAME: ${{ secrets.FUSIONSOLAR_USERNAME || 'SOLGER' }}
          FUSIONSOLAR_PASSWORD: ${{ secrets.FUSIONSOLAR_PASSWORD || 'Solar2022' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '9182298648:AAEWdyYWNsxS3bdvzFqo__ZhFKxR69V_nbk' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '5475150163' }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://cugajlobgbwnvhvtqnxw.supabase.co' }}
          VITE_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.VITE_SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python analytics/report_generator.py

      - name: Publicar artefactos HTML y gráficos generados
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reportes-solger-${{ github.run_number }}
          path: |
            analytics/data/processed/reporte_ejecutivo_latest.html
            analytics/data/processed/*.png
            analytics/data/processed/plants/*.html
          retention-days: 30
